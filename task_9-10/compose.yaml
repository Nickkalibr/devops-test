services:
  web:
    build: .
    image: devops-assignment-web:1.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/metrics', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - /opt/devops-assignment/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      web:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.35.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - /opt/devops-assignment/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager

volumes:
  prometheus-data:
  alertmanager-data:
