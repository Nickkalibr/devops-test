k8sServiceHost: 192.168.56.103
k8sServicePort: 6443
cni:
  chainingMode: flannel
  exclusive: false
  confPath: /var/lib/rancher/k3s/agent/etc/cni/net.d
  binPath: /var/lib/rancher/k3s/data/cni
ipam:
  mode: kubernetes
routingMode: native
enableIPv4Masquerade: false
kubeProxyReplacement: false
l7Proxy: false
operator:
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: task9-k8s2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 128Mi
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
